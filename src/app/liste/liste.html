<h1>Liste des films</h1>
<p class="introduction">Sélectionnez un film pour découvrir son affiche</p>

<div class="catalogue">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title><h2>{{ films.length }} Films à l’affiche</h2></mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-nav-list aria-label="Choisir un film">
        @for (film of films; track film.titre) {
          <a
            mat-list-item
            href="#film-selectionne"
            [activated]="filmSelectionne === film"
            [attr.aria-current]="filmSelectionne === film ? 'true' : null"
            (click)="filmSelectionne = film; $event.preventDefault()"
          >
            <span matListItemTitle>{{ film.titre }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-card-content>
  </mat-card>

  <section id="film-selectionne" aria-live="polite" aria-atomic="true">
    <mat-card appearance="outlined" class="apercu">
      @if (filmSelectionne) {
        <mat-card-header>
          <mat-card-title><h2>{{ filmSelectionne.titre }}</h2></mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <img
            class="affiche"
            [src]="filmSelectionne.affiche"
            [alt]="'Affiche du film ' + filmSelectionne.titre"
          />
        </mat-card-content>
      } @else {
        <mat-card-content class="aucune-selection">
          <h3>Choisissez votre film dans la liste</h3>
        </mat-card-content>
      }
    </mat-card>
  </section>
</div>
