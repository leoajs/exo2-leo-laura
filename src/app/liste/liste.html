<h1>Liste des films</h1>

<nav aria-label="Films">
  <ul>
    @for (film of films; track film.titre) {
      <li><a href="#film-selectionne" (click)="$event.preventDefault(); filmSelectionne = film">{{ film.titre }}</a></li>
    }
  </ul>
</nav>

@if (filmSelectionne) {
  <section id="film-selectionne">
    <h2>{{ filmSelectionne.titre }}</h2>
    <img [src]="filmSelectionne.affiche" [alt]="'Affiche du film ' + filmSelectionne.titre" />
  </section>
}
