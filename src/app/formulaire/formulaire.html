<form [formGroup]="form" (ngSubmit)="onSubmit()" class="formulaire">
    <h2>Contact</h2>

    <mat-form-field appearance="outline">
        <mat-label>Prénom</mat-label>
        <input matInput formControlName="prenom">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="nom">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Âge</mat-label>
        <input matInput type="number" formControlName="age">
    </mat-form-field>

    <mat-checkbox formControlName="hide">Hide</mat-checkbox>

    @if (!form.controls.hide.value) {
    <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
        @if (form.controls.email.hasError('required')) {
        <mat-error>L'email est requis</mat-error>
        } @else if (form.controls.email.hasError('arobase')) {
        <mat-error>L'email doit contenir un @</mat-error>
        }
    </mat-form-field>
    }

    <mat-form-field appearance="outline">
        <mat-label>Commentaire</mat-label>
        <textarea matInput rows="4" formControlName="commentaire"></textarea>
    </mat-form-field>

    <button mat-flat-button type="submit" [disabled]="form.invalid">Envoyer</button>
</form>
